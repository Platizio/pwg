<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Marks the document as script-capable before anything paints, so the
         scroll-reveal animation can hide its own start state WITHOUT hiding the
         page from a reader who has no JavaScript. `.reveal` sets opacity: 0 and
         waits for an IntersectionObserver in App.tsx; the prerendered HTML —
         which exists so the site works without JS — was therefore shipping 30
         invisible elements on /terms and /articles, 23 on /privacy, and 19 on
         Home. Seventeen pages. The escape lives in page.css as
         `html:not(.js) .reveal`. Inline and first, so there is no flash. -->
    <script>document.documentElement.classList.add('js')</script>
    <!-- The terminal at /terminal/:symbol is the one surface with two grounds.
         Light is the default, so only a stored 'dark' has to be restored — and
         it has to be restored HERE, blocking, before anything paints, or a
         reader who chose dark gets a white flash on every prerendered load.
         The attribute sits on <html> because the terminal's own shell does not
         exist until React runs. Inert on the other 61 pages: nothing outside
         .pg-terminal reads it. Key is shared with useTerminalTheme.ts. -->
    <script>try{if(localStorage.getItem('pg-terminal-ground')==='dark'){document.documentElement.dataset.pgTheme='dark'}}catch(e){}</script>
    <meta name="google-site-verification" content="AZiBNhj-C88S1whuGo83lQpDvnOLL9rPYp-f5DUf-xo" />
    <meta name="msvalidate.01" content="BDB1DFA89268951120DC8374DF152176" />
    <!-- Per-page title / description / canonical / OG / Twitter / JSON-LD.
         Injected at build time by scripts/prerender.mjs from react-helmet-async,
         then managed at runtime by the SEO component during client navigation.
         Do not add static title or og:/twitter: meta tags here: react-helmet-async
         only reconciles tags carrying data-rh, so static duplicates are never
         removed and every page would ship two of each. -->
    <!--app-head-->

    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/png" href="/favicon.png" sizes="96x96" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#0A2540" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Three faces, three jobs: Bricolage Grotesque for display headings,
         Inter for body and UI, IBM Plex Mono for market data only (tickers,
         prices, percentages). Weights are kept minimal on purpose — only what
         the design actually uses. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Mono:wght@300;400;500;600&family=Inter:wght@400;500;600;700;800&family=Outfit:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Organization structured data (site-wide) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Platizio Global",
        "url": "https://platizioglobal.com",
        "logo": "https://platizioglobal.com/logo.png",
        "description": "Platizio Global helps Indian investors invest in US Stocks and ETFs under the RBI's Liberalised Remittance Scheme (LRS).",
        "sameAs": [
          "https://www.youtube.com/@platizioglobal",
          "https://www.instagram.com/platizioglobal/",
          "https://x.com/platizioglobal"
        ],
        "contactPoint": {
          "@type": "ContactPoint",
          "telephone": "+91-92898-37100",
          "email": "supportglobal@platizio.com",
          "contactType": "customer support",
          "areaServed": "IN",
          "availableLanguage": ["English", "Hindi"]
        }
      }
    </script>

    <!-- WebSite structured data — sets the site name Google shows above the URL -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Platizio Global",
        "url": "https://platizioglobal.com"
      }
    </script>
  </head>
  <body>
    <!-- The marker must sit flush against the div: whitespace inside #root
         becomes a stray text node that React warns about during hydration. -->
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/entry-client.tsx"></script>
  </body>
</html>
