# Continuous integration.
#
# Until now the only thing standing between a broken commit and production was
# Vercel's own build, which runs after the fact and on the deploy path rather
# than on the pull request. This runs the same gate on every push and PR.
#
# `npm run build` is not just a compile. It chains three checks, and all three
# have caught real problems:
#
#   validate:support  — the 111-node support tree still resolves to a coherent
#                       category/subcategory pair, every leaf has an answer, and
#                       no FAQ id referenced by the tree has gone missing
#   tsc               — `next build` typechecks the whole app under `strict`
#   prerender         — `next build` renders every statically generated route,
#                       so a page that throws while rendering fails here rather
#                       than at request time in production
#
# `npm test` and `npm run lint` now run here too. They did not, and that gap is
# how a market-store change shipped four times with the database suite red: the
# only job that could see it was the pgTAP one, nobody reads a job that has been
# failing since before their change, and the unit suite — 981 tests, the thing
# that actually pins the read path — was never consulted at all.
#
# Treat a failure here as a real failure rather than something to re-run.

name: CI

# Push is limited to main on purpose. A branch with an open PR would otherwise
# match both triggers and run the whole workflow twice for one commit, which is
# what happened on the first run of this file.
on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch makes the first run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Node 22 or newer is required, not preferred: scripts/validate-support-content.mjs
      # imports .ts content modules directly and relies on native type stripping
      # to read them. On an older runtime it fails at import, not at assertion.
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      # Pinned, because `npm ci` is only as reproducible as the npm that wrote
      # the lock file. Node 22 ships npm 10, which expects a handful of wasm
      # optional dependencies (@emnapi/core, @emnapi/runtime) to be hoisted as
      # top-level lock entries; npm 11 — what this repo's lock was written with,
      # and what Render's build uses — records them nested and prunes the
      # duplicates. The mismatch is not a missing package: it fails EUSAGE
      # before a single byte is installed, which is why this job never once ran
      # the build it is named for. Match the lock rather than rewriting it: a
      # lock regenerated under npm 10 drops 769 lines the deploy currently
      # installs from.
      - run: npm i -g npm@11

      - run: npm ci

      # Before the build, because it is thirty seconds against three minutes and
      # it fails on exactly the mistakes a build cannot see: the store read path,
      # the cadence arithmetic, the gate, the tag contract. `--conditions=react-server`
      # is not optional — lib/api and lib/market/store are written to be loadable
      # outside a Next render, and the suite is what holds them to it.
      - run: npm test

      - run: npm run lint

      - run: npm run build

      # `next build` can exit 0 having written nothing useful, and the counts
      # come from the build's own manifests so a prerendering regression shows
      # up here as a number that moved rather than only as a stack trace. The
      # previous version of this step counted files under dist/, which the Vite
      # build wrote and Next never does, so it reported 0 forever and passed.
      - name: Report what was built
        run: |
          node -e '
            const fs = require("node:fs");
            if (!fs.existsSync(".next")) {
              console.error("build exited 0 but wrote no .next directory");
              process.exit(1);
            }
            const appRoutes = require("./.next/app-path-routes-manifest.json");
            const { routes: prerendered } = require("./.next/prerender-manifest.json");
            console.log(`app routes: ${Object.keys(appRoutes).length}`);
            console.log(`prerendered routes: ${Object.keys(prerendered).length}`);
          '

  database:
    name: Database tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Rebuilds the schema from supabase/migrations alone. This is the check
      # that the vendored migrations are a complete and replayable history
      # rather than a partial snapshot of a database that was edited by hand —
      # which matters here beyond correctness, because that history is how the
      # firm evidences which behaviour was live on which date.
      - name: Start Postgres and replay every migration
        run: supabase db start

      - name: Run pgTAP tests
        run: supabase test db
